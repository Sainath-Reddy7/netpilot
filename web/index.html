t": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": NaN, "loss": 100.0, "score": 44.7, "n": 40}, {"lat": NaN, "loss": 100.0, "score": 47.8, "n": 60}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}]}, {"ssid": "Network C", "samples": 34, "median_score": 93.8, "hourly": [{"lat": 41.7, "loss": 0.0, "score": 92.0, "n": 3}, {"lat": 41.2, "loss": 0.0, "score": 92.9, "n": 29}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": 43.0, "loss": 0.0, "score": 92.0, "n": 1}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": NaN, "loss": 100.0, "score": 6.2, "n": 1}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}]}, {"ssid": "Network D", "samples": 327, "median_score": 49.6, "hourly": [{"lat": null, "loss": null, "score": null, "n": 0}, {"lat": 42.7, "loss": 99.2, "score": 49.6, "n": 310}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": NaN, "loss": 100.0, "score": 36.0, "n": 16}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": NaN, "loss": 100.0, "score": 33.8, "n": 1}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}, {"lat": null, "loss": null, "score": null, "n": 0}]}], "incidents": [{"when": "09 Sep 05:17", "type": "DNS_FAIL", "detail": "DNS resolution failing (3 hosts this cycle)."}], "availability": 100.0};
let DATA = EMBEDDED;

const VC = { GO: '#34d399', WARN: '#fbbf24', DEAD: '#fb7185' };
const VC2 = { GO: '#2dd4bf', WARN: '#fb923c', DEAD: '#f472b6' };
const TC = { OUTAGE: '#fb7185', WIFI_DOWN: '#fb7185', DNS_FAIL: '#fbbf24',
             AP_ROAM: '#4d9fff', NETWORK_CHANGE: '#4d9fff', WIFI_UP: '#34d399' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gradeOf = sc => sc >= 90 ? 'A' : sc >= 75 ? 'B' : sc >= 60 ? 'C' : sc >= 40 ? 'D' : 'F';
const fmtInt = x => Number(x).toLocaleString();

function latColor(ms) {
  if (ms === null || ms === undefined) return null;
  if (ms < 50) return '#10b981'; if (ms < 80) return '#a3e635';
  if (ms < 120) return '#f59e0b'; if (ms < 200) return '#f97316';
  return '#ef4444';
}
function ago(iso) {
  try {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return Math.round(s) + 's ago';
    if (s < 5400) return Math.round(s/60) + 'min ago';
    return Math.round(s/3600) + 'h ago';
  } catch (e) { return '?'; }
}
const curHour = () => new Date().getHours();

function countUp(el, target, dur = 1100) {
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(target * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function stat(k, v) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function areaChart(hourly, id) {
  const W = 880, H = 150, padL = 12, padR = 12, padT = 16, padB = 24;
  const pts = hourly.map((x, h) => ({ h, v: x.lat })).filter(p => p.v !== null && p.v !== undefined);
  if (pts.length < 3) return '<div class="chart-empty">— curve appears as data accumulates —</div>';
  const max = Math.max(...pts.map(p => p.v)) * 1.08 || 1;
  const min = Math.min(...pts.map(p => p.v)) * 0.92;
  const X = h => padL + (h / 23) * (W - padL - padR);
  const Y = v => H - padB - ((v - min) / (max - min || 1)) * (H - padT - padB);
  const segs = [];
  let seg = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].h === pts[i - 1].h + 1) seg.push(pts[i]);
    else { segs.push(seg); seg = [pts[i]]; }
  }
  segs.push(seg);
  const path = ps => {
    let d = `M ${X(ps[0].h).toFixed(1)} ${Y(ps[0].v).toFixed(1)}`;
    for (let i = 0; i < ps.length - 1; i++) {
      const p0 = ps[Math.max(0, i - 1)], p1 = ps[i], p2 = ps[i + 1], p3 = ps[Math.min(ps.length - 1, i + 2)];
      const c1x = X(p1.h) + (X(p2.h) - X(p0.h)) / 6, c1y = Y(p1.v) + (Y(p2.v) - Y(p0.v)) / 6;
      const c2x = X(p2.h) - (X(p3.h) - X(p1.h)) / 6, c2y = Y(p2.v) - (Y(p3.v) - Y(p1.v)) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${X(p2.h).toFixed(1)} ${Y(p2.v).toFixed(1)}`;
    }
    return d;
  };
  const lines = segs.filter(s => s.length > 1).map(path).join(' ');
  const main = segs.reduce((a, s) => s.length > a.length ? s : a, []);
  const area = path(main) + ` L ${X(main[main.length - 1].h).toFixed(1)} ${H - padB} L ${X(main[0].h).toFixed(1)} ${H - padB} Z`;
  const grid = [0.25, 0.5, 0.75].map(k => {
    const y = padT + k * (H - padT - padB);
    return `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="rgba(148,163,197,.08)" stroke-dasharray="3 7"/>`;
  }).join('');
  const labels = [0, 6, 12, 18, 23].map(h =>
    `<text x="${X(h)}" y="${H - 7}" fill="#5c6a80" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="${h === 0 ? 'start' : h === 23 ? 'end' : 'middle'}">${String(h).padStart(2,'0')}</text>`).join('');
  const peak = pts.reduce((a, p) => p.v > a.v ? p : a, pts[0]);
  const dot = `<circle cx="${X(peak.h)}" cy="${Y(peak.v)}" r="4" fill="#ef4444"/>
    <text x="${Math.min(W - 110, X(peak.h) + 9)}" y="${Math.max(13, Y(peak.v) - 8)}" fill="#9aa7bb" font-size="9" font-family="JetBrains Mono, monospace">peak ${Math.round(peak.v)}ms @${String(peak.h).padStart(2,'0')}:00</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="24 hour latency curve">
    <defs>
      <linearGradient id="ag${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4d9fff" stop-opacity=".3"/><stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ln${id}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4d9fff"/><stop offset="1" stop-color="#a371f7"/>
      </linearGradient>
    </defs>
    ${grid}${labels}
    <path d="${area}" fill="url(#ag${id})"/>
    <path d="${lines}" fill="none" stroke="url(#ln${id})" stroke-width="2.8" stroke-linecap="round" style="filter:drop-shadow(0 3px 8px rgba(77,159,255,.4))"/>
    ${dot}
  </svg>`;
}

function gaugeSvg(score, verdict) {
  const C = 2 * Math.PI * 66;
  const off = C * (1 - Math.max(0, Math.min(100, score)) / 100);
  const c1 = VC[verdict] || '#4d9fff', c2 = VC2[verdict] || '#a371f7';
  return `<div class="gauge" style="--vc:${c1}">
    <svg width="168" height="168" viewBox="0 0 168 168">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
      <circle class="track" cx="84" cy="84" r="66"></circle>
      <circle class="bar" cx="84" cy="84" r="66" stroke="url(#rg)"
              stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"></circle>
    </svg>
    <div class="mid"><div class="num" id="scoreNum">0</div><div class="lbl">score</div>
    <div class="gr" style="color:${c1}">${gradeOf(score)} grade</div></div>
  </div>`;
}

const seenVals = {};
function bumpChanged() {
  for (const el of document.querySelectorAll('.stat .v, .card .v')) {
    const holder = el.closest('.stat') || el.closest('.card');
    const k = holder ? (holder.querySelector('.k')?.textContent || '') : '';
    if (k) {
      if (seenVals[k] !== undefined && seenVals[k] !== el.textContent) {
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
      seenVals[k] = el.textContent;
    }
  }
}

function renderTicker() {
  const nn = DATA.now;
  const t = [];
  if (nn) {
    const cls = nn.verdict === 'GO' ? 'ok' : nn.verdict === 'DEAD' ? 'no' : 'wm';
    t.push(`<b class="${cls}">● ${esc(nn.verdict)}</b>`);
    t.push(`score <b>${esc(nn.score)}</b>`);
    t.push(`${esc(nn.ssid || 'unknown')}`);
    t.push(`latency <b>${nn.avg_ms != null ? esc(nn.avg_ms) + 'ms' : '–'}</b>`);
    t.push(`loss <b>${nn.loss_pct != null ? esc(nn.loss_pct) + '%' : '–'}</b>`);
    t.push(`jitter <b>${nn.jitter_ms != null ? esc(nn.jitter_ms) + 'ms' : '–'}</b>`);
  }
  if (DATA.networks.length) t.push(`<b>${DATA.networks.length}</b> networks tracked`);
  if (DATA.availability != null) t.push(`availability <b>${DATA.availability.toFixed(1)}%</b>`);
  t.push(`<i>measured locally · refreshes every 60s</i>`);
  const half = t.map(x => `<span>${x}</span>`).join('<i> ✦ </i>');
  document.getElementById('tickIn').innerHTML = half + '<i> ✦ </i>' + half + '<i> ✦ </i>';
  document.title = `NetPilot · ${nn ? nn.verdict + ' ' + Math.round(nn.score) + ' · ' : ''}LIVE`;
}

function render() {
  renderTicker();
  document.getElementById('meta').textContent =
    'updated ' + ago(DATA.updated) + (DATA.demo ? ' · DEMO' : '');

  const n = DATA.now;
  const heroEl = document.getElementById('hero');
  if (n) {
    const c1 = VC[n.verdict] || '#4d9fff', c2 = VC2[n.verdict] || '#a371f7';
    const band = n.band ? ' · ' + esc(n.band) : '';
    const sig = n.signal ? ' · ' + esc(n.signal) + '% signal' : '';
    const vpn = n.vpn && n.vpn !== 'none' ? ' · VPN: ' + esc(n.vpn) : '';
    const note = n.note ? `<div class="note">⚠ ${esc(n.note)}</div>` : '';
    let extra = '';
    if (n.bloat) extra += stat('bloat ↓/↑', `${esc(n.bloat.down || '–')}<small>/</small>${esc(n.bloat.up || '–')}`);
    if (n.mtu) extra += stat('path mtu', esc(n.mtu));
    heroEl.innerHTML = `
      <div class="glowfield" style="--vc:${c1}22"></div>
      <svg class="ekg" viewBox="0 0 900 44" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 26 H120 l10 0 6 -14 8 28 6 -14 H320 l10 0 6 -14 8 28 6 -14 H560 l10 0 6 -14 8 28 6 -14 H900"/>
      </svg>
      <div class="hero-left" style="--vc1:${c1};--vc2:${c2};--vcs:${c1}45">
        <div class="big-verdict">${esc(n.verdict)}</div>
        <div class="net">${esc(n.ssid || 'unknown')}${band}</div>
        <div class="meta">${sig ? esc(n.signal) + '% signal · ' : ''}grade <b>${gradeOf(n.score)}</b> · latency <b>${n.avg_ms != null ? esc(n.avg_ms) + 'ms' : '–'}</b> · loss <b>${n.loss_pct != null ? esc(n.loss_pct) + '%' : '–'}</b>${vpn}</div>
        ${note}
      </div>
      ${gaugeSvg(n.score, n.verdict)}
      <div class="strip">
        ${stat('latency', n.avg_ms != null ? esc(n.avg_ms) + ' <small>ms</small>' : '–')}
        ${stat('loss', n.loss_pct != null ? esc(n.loss_pct) + ' <small>%</small>' : '–')}
        ${stat('jitter', n.jitter_ms != null ? esc(n.jitter_ms) + ' <small>ms</small>' : '–')}
        ${extra}
      </div>`;
    heroEl.style.setProperty('--vc', c1);
    countUp(heroEl.querySelector('#scoreNum'), n.score);
    const immediate = document.documentElement.classList.contains('shot');
    requestAnimationFrame(() => {
      const bar = heroEl.querySelector('.bar');
      if (bar) setTimeout(() => { bar.style.strokeDashoffset = bar.dataset.off; }, immediate ? 0 : 90);
    });
  }

  const scores = DATA.networks.map(x => x.median_score);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  const totalSamples = DATA.networks.reduce((a, x) => a + (x.samples || 0), 0);
  document.getElementById('cards').innerHTML = [
    ['networks', DATA.networks.length, 'monitored · 7 days'],
    ['median score', avg, 'across networks'],
    ['availability', DATA.availability != null ? DATA.availability.toFixed(2) + '<small>%</small>' : '–', 'uptime while watched'],
    ['probes', fmtInt(totalSamples), 'cycles logged'],
  ].map(([k, v, d]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');

  const H = curHour();
  document.getElementById('nets').innerHTML = DATA.networks.map((net, i) => {
    const g = gradeOf(net.median_score);
    const heat = net.hourly.map((x, h) => {
      const col = latColor(x.lat);
      const cls = col ? '' : ' nodata';
      const tip = col ? `${String(h).padStart(2,'0')}:00 — ${x.lat}ms · ${x.loss}% loss · ${x.score}` : `${String(h).padStart(2,'0')}:00 — no data`;
      return `<div class="cell${cls}${h === H ? ' now' : ''}"${col ? ` style="background:${col}"` : ''} data-tip="${esc(tip)}"></div>`;
    }).join('');
    const good = net.hourly.map((x, h) => ({h, x})).filter(o => o.x.score != null && o.x.score >= 75).map(o => o.h);
    const dead = net.hourly.map((x, h) => ({h, x})).filter(o => o.x.score != null && o.x.score < 40).map(o => o.h);
    const fmt = hs => hs.length ? hs.map(h => String(h).padStart(2,'0')).join(' ') : 'none';
    const num = String(i + 1).padStart(2, '0');
    return `<div class="reveal" style="animation-delay:${.12 + i * .08}s">
      <div class="seclabel">
        <span class="overline" style="flex:0 0 auto">net ${num}</span>
        <h2>${esc(net.ssid)}</h2>
        <span class="pill g${g}">${net.median_score} · ${g}</span>
        <span class="sub">${fmtInt(net.samples)} samples</span>
      </div>
      <section class="net">
        <div class="chart-wrap">${areaChart(net.hourly, i)}</div>
        <div class="heat-scroll"><div class="heat">
          ${Array.from({length: 24}, (_, h) => `<div class="h">${String(h).padStart(2,'0')}</div>`).join('')}${heat}
        </div></div>
        <div class="legend"><span>fast</span><div class="gradbar"></div><span>slow</span><span>▨ no data</span></div>
        <div class="chips">
          <span class="chip good">healthy ${fmt(good)}</span>
          <span class="chip bad">dead ${fmt(dead)}</span>
        </div>
      </section>
    </div>`;
  }).join('');

  document.getElementById('incidents').innerHTML = DATA.incidents.length
    ? DATA.incidents.map(e => `
      <div class="tl-item" style="--tc: ${TC[e.type] || '#9aa7bb'}">
        <div class="tl-when">${esc(e.when)}</div>
        <div>
          <div class="tl-type">${esc(e.type.replace(/_/g, ' '))}</div>
          <div class="tl-detail">${esc(e.detail)}</div>
        </div>
      </div>`).join('')
    : '<div class="tl-empty">no incidents — that\'s a good thing</div>';

  bumpChanged();
}

/* spotlight hover */
document.addEventListener('pointermove', e => {
  for (const el of document.querySelectorAll('.card, section.net')) {
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }
  }
}, { passive: true });

function setBadge(live) {
  const b = document.getElementById('badge');
  b.className = 'badge ' + (live ? 'live' : 'cached');
  b.innerHTML = live ? '<span class="pulse"></span>LIVE' : 'CACHED';
}

async function loadLive() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    setBadge(true);
    document.getElementById('src').textContent = 'live collector';
    const hero = document.getElementById('hero');
    hero.classList.remove('fresh'); void hero.offsetWidth; hero.classList.add('fresh');
  } catch (e) {
    setBadge(false);
    document.getElementById('src').textContent = 'embedded snapshot';
  }
  render();
}

render();
loadLive();
setInterval(loadLive, 60000);
</script>
