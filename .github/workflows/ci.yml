name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m py_compile netpilot.py prober.py health.py dashboard.py dnscheck.py bloat.py traceroute.py mtu.py vpndetect.py events.py logger.py report.py wifi_env.py notify.py

      - name: Import smoke test
        run: python -c "import netpilot, prober, health, dashboard, dnscheck, bloat, traceroute, mtu, vpndetect, events, logger, report, wifi_env, notify; print('all modules import cleanly')"
