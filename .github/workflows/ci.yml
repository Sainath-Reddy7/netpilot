name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile all modules
        run: python -m py_compile netpilot.py prober.py health.py dashboard.py dnscheck.py bloat.py traceroute.py mtu.py vpndetect.py events.py logger.py report.py wifi_env.py notify.py web.py

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Publish demo web dashboard (artifacts check)
        run: python netpilot.py --publish --demo
